plugins {
    id 'com.android.application'
}

def repositoryRoot = rootProject.projectDir.parentFile
// Engine-owned (GPL) resources the native renderer needs at runtime. Game data
// is never packaged; see doc/procedure/android-port.md.
def engineAssetsDir = layout.buildDirectory.dir('generated/openxray-assets')

def stageEngineResources = tasks.register('stageEngineResources', Sync) {
    from(new File(repositoryRoot, 'res/gamedata/shaders/gl')) {
        into 'openxray/gamedata/shaders/gl'
    }
    into engineAssetsDir
}
tasks.named('preBuild') { dependsOn stageEngineResources }

android {
    namespace = 'org.openxray.android'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion = '29.0.14206865'

    defaultConfig {
        applicationId 'org.openxray.android'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.8.0-alpha.1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            // Sideloaded test builds stay installable without a private key;
            // a store release overrides this with its own signing config.
            signingConfig signingConfigs.debug
            ndk {
                // Unstripped symbols are kept beside the APK for symbolizing
                // tombstones; the packaged libraries are stripped.
                debugSymbolLevel 'FULL'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '4.1.2'
        }
    }

    sourceSets {
        main {
            java.srcDir new File(repositoryRoot, 'Externals/SDL2/android-project/app/src/main/java')
            assets.srcDir engineAssetsDir
        }
    }

    lint {
        baseline = file('lint-baseline.xml')
        // lintVital cannot serialize the external SDL java source directory
        // against the baseline (AGP 8.13); CI runs the full lintDebug instead.
        checkReleaseBuilds = false
    }
}
